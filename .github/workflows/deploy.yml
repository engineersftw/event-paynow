name: Deploy

# Deploys from main only, and only the part whose files changed:
#   Worker -> src/ (except src/web/), wrangler.toml, package*.json, tsconfig.json
#   Pages  -> web/, src/{web,db,sgqr,payments,access}/, src/commands/payer-label.ts, package*.json,
#             tsconfig.json   (everything the Pages Function bundles; check with esbuild --metafile)
#   Migrate -> anything under drizzle/ (runs first; Worker and Pages wait for it, and are skipped
#              if it fails)
# Run it by hand (Actions -> Deploy -> Run workflow) to deploy both and apply pending migrations.
# Needs repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# Migrations must be backward compatible: the old code keeps serving between migrate and deploy.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      migrate: ${{ steps.diff.outputs.migrate }}
      worker: ${{ steps.diff.outputs.worker }}
      pages: ${{ steps.diff.outputs.pages }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          # Manual runs, or a push whose previous commit is unknown (new branch, force push): deploy all
          if [ "$EVENT" = workflow_dispatch ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "migrate=true" >> "$GITHUB_OUTPUT"
            echo "worker=true" >> "$GITHUB_OUTPUT"
            echo "pages=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          echo "Changed files:"; echo "$files"
          if echo "$files" | grep -Eq '^drizzle/'; then
            echo "migrate=true" >> "$GITHUB_OUTPUT"
          else
            echo "migrate=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$files" | grep -Ev '^src/web/' | grep -Eq '^(src/|wrangler\.toml$|package(-lock)?\.json$|tsconfig\.json$)'; then
            echo "worker=true" >> "$GITHUB_OUTPUT"
          else
            echo "worker=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$files" | grep -Eq '^(web/|src/(web|db|sgqr|payments|access)/|src/commands/payer-label\.ts$|package(-lock)?\.json$|tsconfig\.json$)'; then
            echo "pages=true" >> "$GITHUB_OUTPUT"
          else
            echo "pages=false" >> "$GITHUB_OUTPUT"
          fi

  migrate:
    name: Apply D1 migrations
    needs: changes
    if: needs.changes.outputs.migrate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Wrangler tracks applied migrations in D1 (d1_migrations), so re-runs skip them
      - run: npx wrangler d1 migrations apply paynow-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  worker:
    name: Deploy Worker
    needs: [changes, migrate]
    # Runs when migrate was skipped, but not when it failed or the run was cancelled
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.worker == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  pages:
    name: Deploy Pages
    needs: [changes, migrate]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.pages == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx wrangler pages deploy public --project-name event-paynow-web --branch main
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
