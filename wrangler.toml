name = "event-paynow"
main = "src/index.ts"
compatibility_date = "2024-12-05"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "paynow_db"
database_name = "paynow-db"
database_id = "c0387aac-9b54-4329-9355-d2e5572e0eab"
migrations_dir = "drizzle"

[durable_objects]
bindings = [{ name = "CHAT_SESSION", class_name = "ChatSessionDO" }]

# Workers AI, used to read receipt photos. Remote only: local runs and tests use a fake reader.
# Split_PayNow_Bot posts each QR from this queue (one message per QR, retried on errors).
# Create it once: npx wrangler queues create split-qr-sends
[[queues.producers]]
queue = "split-qr-sends"
binding = "SPLIT_QR_QUEUE"

[[queues.consumers]]
queue = "split-qr-sends"
max_batch_size = 10
max_batch_timeout = 1
max_retries = 5

# Split_PayNow_Bot reads receipt photos and voice notes in this Workflow (timeouts, retries, no 30 s limit).
[[workflows]]
name = "split-ai"
binding = "SPLIT_AI_WORKFLOW"
class_name = "SplitAiWorkflow"

[ai]
binding = "AI"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatSessionDO"]

[vars]
BOT_USERNAME = "event_paynow_bot"
SIMPLE_BOT_USERNAME = "Simple_PayNow_Bot"
SPLIT_BOT_USERNAME = "Split_PayNow_Bot"
# Vision model for Split_PayNow_Bot receipt scans (Workers AI). Llama 4 Scout read a real 10-item receipt
# completely in every test run (about 8 s, 70 neurons a scan); Llama 3.2 11B missed one or two items every time.
RECEIPT_MODEL = "@cf/meta/llama-4-scout-17b-16e-instruct"
# Speech-to-text for voice notes that answer "who had what" (Workers AI; the same Llama then writes the lines).
VOICE_MODEL = "@cf/openai/whisper-large-v3-turbo"
# WEB_ADMIN_URL = "https://event-paynow-web.pages.dev"  # set after creating the Pages project

# Set via `wrangler secret put TELEGRAM_BOT_TOKEN`
# Simple_PayNow_Bot: `wrangler secret put SIMPLE_BOT_TOKEN` and `SIMPLE_WEBHOOK_SECRET`
# Split_PayNow_Bot: `wrangler secret put SPLIT_BOT_TOKEN` and `SPLIT_WEBHOOK_SECRET`

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true
