name = "event-paynow"
main = "src/index.ts"
compatibility_date = "2024-12-05"
compatibility_flags = ["nodejs_compat"]

# Placeholder IDs — replace after `wrangler d1 create` and `wrangler whoami`
[[d1_databases]]
binding = "paynow_db"
database_name = "paynow-db"
database_id = "c0387aac-9b54-4329-9355-d2e5572e0eab"
migrations_dir = "drizzle"

[durable_objects]
bindings = [{ name = "CHAT_SESSION", class_name = "ChatSessionDO" }]

# Workers AI, used to read receipt photos. Remote only: local runs and tests use a fake reader.
[ai]
binding = "AI"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatSessionDO"]

[vars]
BOT_USERNAME = "event_paynow_bot"
SIMPLE_BOT_USERNAME = "Simple_PayNow_Bot"
SPLIT_BOT_USERNAME = "Split_PayNow_Bot"
# Vision model for Split_PayNow_Bot receipt scans (Workers AI). Llama 3.2 vision asks for a one-time licence
# acceptance, which the bot sends itself on the first scan.
RECEIPT_MODEL = "@cf/meta/llama-3.2-11b-vision-instruct"
# WEB_ADMIN_URL = "https://event-paynow-web.pages.dev"  # set after creating the Pages project

# Set via `wrangler secret put TELEGRAM_BOT_TOKEN`
# Simple_PayNow_Bot: `wrangler secret put SIMPLE_BOT_TOKEN` and `SIMPLE_WEBHOOK_SECRET`
# Split_PayNow_Bot: `wrangler secret put SPLIT_BOT_TOKEN` and `SPLIT_WEBHOOK_SECRET`

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true
