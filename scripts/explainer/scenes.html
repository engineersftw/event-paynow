<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Event PayNow Bot explainer</title>
<style>
/* 1920x1080 stage. Everything is positioned by window.renderAt(t): no real-time animation, so every frame is reproducible. */
:root{--bg:#f4f6fb;--card:#fff;--fg:#0f172a;--muted:#64748b;--line:#e2e8f0;--brand:#1d4ed8;--green:#15803d;--greenbg:#dcfce7;--amber:#92400e;--amberbg:#fef3c7;--tg:#2b7cd3}
*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden}
body{font:34px/1.35 "Noto Sans","DejaVu Sans",system-ui,sans-serif;color:var(--fg);background:linear-gradient(160deg,#eef2ff,#f8fafc 55%,#ecfeff)}
#stage{position:relative;width:1920px;height:1080px}
.top{position:absolute;left:64px;top:40px;display:flex;align-items:center;gap:18px;font-weight:700;font-size:34px}
.top img{width:60px;height:60px;border-radius:12px}
.chip{position:absolute;right:64px;top:44px;padding:8px 26px;border-radius:999px;background:var(--brand);color:#fff;font-weight:700;font-size:30px}
.scene{position:absolute;left:0;right:0;top:130px;height:770px;display:none;align-items:center;justify-content:center;gap:56px}
.cap{position:absolute;left:0;right:0;bottom:0;height:170px;background:#0f172a;color:#fff;display:flex;align-items:center;justify-content:center;padding:0 120px;text-align:center;font-size:44px;font-weight:600;line-height:1.3}
.r{opacity:0}
.card{background:var(--card);border:2px solid var(--line);border-radius:28px;box-shadow:0 10px 40px rgba(15,23,42,.08);padding:30px}
.chat{width:760px;display:flex;flex-direction:column;gap:18px;min-height:560px;background:#dbe7f5;border-radius:28px;padding:30px;border:2px solid #c3d4ea}
.msg{max-width:80%;padding:16px 24px;border-radius:24px;font-size:32px}
.msg.u{align-self:flex-end;background:var(--tg);color:#fff;border-bottom-right-radius:6px}
.msg.b{align-self:flex-start;background:#fff;border-bottom-left-radius:6px}
.msg img{display:block;width:300px;height:auto;border-radius:12px;margin-bottom:10px}
.chat h4{margin:0 0 4px;font-size:28px;color:#334155}
.btns{display:flex;gap:12px;margin-top:10px}.btn{padding:10px 22px;border-radius:14px;background:#e8eefb;border:2px solid #bcd0ee;font-weight:700;font-size:28px}
.btn.hl{background:var(--green);border-color:var(--green);color:#fff}
.page{width:640px}.page h3{margin:0 0 16px;font-size:36px}.field{border:2px solid var(--line);border-radius:12px;padding:12px 18px;margin:10px 0;color:var(--muted)}
.bigbtn{background:#0f172a;color:#fff;border-radius:14px;padding:16px;text-align:center;font-weight:700;margin-top:14px}
.title{display:flex;flex-direction:column;align-items:center;gap:26px;text-align:center}.title img{width:240px;height:240px;border-radius:44px}
.title h1{margin:0;font-size:110px;letter-spacing:-2px}.title p{margin:0;font-size:44px;color:var(--muted)}
.web{width:980px}.stats{display:flex;gap:20px;margin:16px 0}.stat{flex:1;background:var(--bg);border-radius:16px;padding:14px 20px}.stat b{display:block;font-size:44px}
.row{display:flex;align-items:center;justify-content:space-between;border:2px solid var(--line);border-radius:16px;padding:14px 22px;margin:12px 0}
.badge{padding:4px 16px;border-radius:999px;font-weight:700;font-size:26px}.badge.g{background:var(--greenbg);color:var(--green)}.badge.a{background:var(--amberbg);color:var(--amber)}
.ok{border:3px solid var(--green);color:var(--green);border-radius:999px;padding:4px 18px;font-weight:700;font-size:26px}
.phone{width:440px;height:700px;background:#0f172a;border-radius:56px;padding:20px}.screen{background:#fff;border-radius:40px;height:100%;padding:24px;display:flex;flex-direction:column;align-items:center;gap:18px}
.screen h3{margin:0;font-size:32px}.view{width:330px;height:330px;border-radius:24px;background:#111827;display:flex;align-items:center;justify-content:center}.view img{width:260px;height:260px;border-radius:10px}
.pay{background:#dc2626;color:#fff;border-radius:16px;padding:16px 40px;font-weight:700;font-size:32px}.pay.done{background:var(--green)}
.arrow{font-size:90px;color:var(--brand)}
.pill{background:var(--tg);color:#fff;border-radius:999px;padding:22px 60px;font-size:60px;font-weight:700}
.sub{color:var(--muted);font-size:30px}
#s-org-share{gap:36px}#s-org-share .chat{width:540px;min-height:520px}#s-org-share .page{width:560px}#s-org-share .msg img{width:260px}
.scene.on{display:flex}
.selfend{align-self:flex-end;max-width:80%}.selfend .msg{max-width:none}
</style></head><body>
<div id="stage">
  <div class="top"><img src="/logo.png" alt=""><span>Event PayNow Bot</span></div>
  <div class="chip" id="chip"></div>
  <div id="scenes"></div>
  <div class="cap" id="cap"></div>
</div>
<script>
const QR = '/sample-qr.png';
// helper: element that fades/slides in when the scene is `at` (0..1) of the way through
const r = (at, html, cls = '') => `<div class="r ${cls}" data-at="${at}">${html}</div>`;
const chat = (title, msgs) => `<div class="chat"><h4>${title}</h4>${msgs.join('')}</div>`;
const u = (at, t) => r(at, `<div class="msg u">${t}</div>`, 'selfend');
const b = (at, t) => r(at, `<div class="msg b">${t}</div>`);
const qrMsg = (at, caption, btns = '') => r(at, `<div class="msg b"><img src="${QR}" alt="">${caption}${btns ? `<div class="btns">${btns}</div>` : ''}</div>`);
const webPage = (at) => r(at, `<div class="card page"><h3>Make payment for event.</h3><div class="field">Your PayNow mobile / UEN</div><div class="field">Alex</div><div class="bigbtn">Show payment QR</div></div>`);

const SCENES = {
  'title': () => `<div class="title">${r(0.0, '<img src="/logo.png" alt="">')}${r(0.12, '<h1>Event PayNow Bot</h1>')}${r(0.3, '<p>Collect PayNow payments for your event, from Telegram</p>')}</div>`,
  'org-init': () => chat('Event PayNow Bot', [
      u(0.06, '/init'), b(0.18, 'What is the event name?'), u(0.32, 'Team Dinner'),
      b(0.46, 'Who gets paid? Send a PayNow mobile number or UEN.'), u(0.62, '201900000A'),
      b(0.78, '✅ Event created: Team Dinner')]),
  'org-share': () => `<div style="display:flex;flex-direction:column;gap:20px">${r(0.05, '<div class="sub">Share a link</div>')}
      ${chat('Team chat', [u(0.12, '/web_payment'), b(0.28, 'Payment page for Team Dinner')])}</div>
      ${webPage(0.4)}
      <div style="display:flex;flex-direction:column;gap:20px">${r(0.52, '<div class="sub">Or issue a QR yourself</div>')}
      ${chat('Team chat', [u(0.58, '/start'), qrMsg(0.74, 'Team Dinner · SGD 12.50')])}</div>`,
  'org-received': () => chat('Team chat', [
      qrMsg(0.04, 'Team Dinner · SGD 12.50 · Payer: Alex', '<span class="btn" id="rcv">✓ Received</span><span class="btn">✖ Void</span>'),
      b(0.62, '✅ Received: Alex, SGD 12.50')]),
  'org-checkin': () => `<div class="card web">${r(0.04, '<h3 style="margin:0">Event: Team Dinner &nbsp;<span class="btn">Check-In</span> <span class="btn">Pay</span></h3>')}
      ${r(0.16, '<div class="stats"><div class="stat"><span class="sub">Checked in</span><b id="ci">0</b></div><div class="stat"><span class="sub">Not checked in</span><b id="nci">2</b></div></div>')}
      ${r(0.28, '<div class="row"><span><b>Alex</b> &nbsp;SGD 12.50</span><span><span class="badge g">received</span> &nbsp;<span class="btn hl" id="alexbtn">Check-In</span></span></div>')}
      ${r(0.38, '<div class="row"><span><b>Sam</b> &nbsp;SGD 12.50</span><span><span class="badge a">pending</span> &nbsp;<span class="btn" id="sambtn">Check-In</span></span></div>')}
      ${r(0.7, '<div class="sub">Scan their QR with the camera, or tap Check-In on their row.</div>')}</div>`,
  'org-payback': () => chat('Team chat', [
      u(0.06, '/payback'), b(0.22, 'Pay back which payment?<br>Alex · SGD 12.50'), u(0.4, 'SGD 5.00'),
      qrMsg(0.58, 'Payback to Alex · SGD 5.00', '<span class="btn">✓ Sent</span><span class="btn">✖ Cancel</span>')]),
  'att-qr': () => `${chat('Your chat with the bot', [qrMsg(0.1, 'Team Dinner · SGD 12.50<br><b>Keep this QR for event check-in and payment verification.</b>')])}
      <div style="display:flex;align-items:center;gap:30px">${r(0.4, '<div class="arrow">or</div>')}${webPage(0.5)}</div>`,
  'att-pay': () => `<div class="phone">${r(0.04, `<div class="screen"><h3>Scan &amp; Pay</h3><div class="view"><img src="${QR}" alt=""></div><div id="paywho" style="font-size:30px;text-align:center">Pay Team Dinner<br><b>SGD 12.50</b></div><div class="pay" id="paybtn">Pay now</div></div>`)}</div>`,
  'att-keep': () => `<div class="phone">${r(0.04, `<div class="screen"><h3>Team Dinner</h3><img src="${QR}" style="width:340px" alt=""><div class="sub">Show this at the door</div></div>`)}</div>
      ${r(0.35, '<div class="arrow">→</div>')}
      ${r(0.5, '<div class="card" style="width:520px;text-align:center"><div class="sub">Organizer scans it</div><div style="font-size:60px;color:var(--green);font-weight:800;margin-top:12px">✓ Checked in</div><div style="font-size:40px">Alex</div></div>')}`,
  'outro': () => `<div class="title">${r(0.0, '<img src="/logo.png" alt="">')}${r(0.15, '<h1 style="font-size:84px">Add the bot on Telegram</h1>')}${r(0.4, '<div class="pill">t.me/event_paynow_bot</div>')}</div>`,
};

let DATA;
const el = (id) => document.getElementById(id);
const clamp = (x) => Math.min(1, Math.max(0, x));

async function init() {
  DATA = await (await fetch('/captions.json')).json();
  el('scenes').innerHTML = DATA.scenes.map((s) => `<section class="scene" id="s-${s.id}">${SCENES[s.id]()}</section>`).join('');
  await Promise.all([...document.images].map((i) => (i.complete ? 0 : new Promise((ok) => { i.onload = i.onerror = ok; }))));
  window.ready = true;
}

window.renderAt = (t) => {
  const sc = DATA.scenes.find((s) => t >= s.start && t < s.end) ?? DATA.scenes.at(-1);
  const p = clamp((t - sc.start) / (sc.end - sc.start));
  for (const s of DATA.scenes) el(`s-${s.id}`).classList.toggle('on', s === sc);
  el('cap').textContent = sc.text;
  el('chip').textContent = sc.chapter;
  el('chip').style.visibility = sc.chapter === 'Intro' ? 'hidden' : 'visible';
  for (const n of el(`s-${sc.id}`).querySelectorAll('.r')) {
    const k = clamp((p - Number(n.dataset.at)) / 0.08);
    n.style.opacity = k;
    n.style.transform = `translateY(${(1 - k) * 26}px)`;
  }
  // scene-specific state changes driven by progress
  const hl = (id, on) => { const n = el(id); if (n) n.classList.toggle('hl', on); };
  hl('rcv', sc.id === 'org-received' && p > 0.4 && p < 0.62);
  if (sc.id === 'org-checkin') {
    const done = p > 0.55;
    el('sambtn').textContent = done ? '✓ Checked in' : 'Check-In';
    el('sambtn').className = done ? 'ok' : 'btn hl';
    el('alexbtn').className = 'btn';
    el('ci').textContent = done ? '1' : '0';
    el('nci').textContent = done ? '1' : '2';
  }
  if (sc.id === 'att-pay') {
    const done = p > 0.7;
    el('paybtn').textContent = done ? '✓ Paid' : 'Pay now';
    el('paybtn').className = `pay${done ? ' done' : ''}`;
  }
};
init();
</script></body></html>
